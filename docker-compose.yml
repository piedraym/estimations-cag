services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      REDIS_HOST: redis
    ports:
      - "8000:8000"
    depends_on:
      - redis

  ui:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      REDIS_HOST: redis
      API_BASE_URL: http://api:8000
    command: uv run streamlit run streamlit_app.py --server.address=0.0.0.0
    ports:
      - "8501:8501"
    depends_on:
      - api

volumes:
  redis_data:
